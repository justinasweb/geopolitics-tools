# Drafts AI texts from their facts files and opens a pull request with them (docs/ai-drafting.md). Run it by hand:
# Actions tab -> ai-draft -> Run workflow, with the texts to draft ("--all", or ids such as "river:nile page:about").
# It needs the ANTHROPIC_API_KEY secret; without it the run stops with a message saying how to draft by hand.
# Pull requests opened with the default GITHUB_TOKEN do not start CI, so the Preview needs GH_PR_TOKEN: a fine-grained
# token for this repository with "Contents" and "Pull requests" read and write. Without it the pull request is still
# opened, and its checks start on the next push to it.
name: ai-draft
on:
  workflow_dispatch:
    inputs:
      texts:
        description: 'Texts to draft: --all, or ids such as river:nile page:about'
        required: true
        default: '--all'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ai-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { token: '${{ secrets.GH_PR_TOKEN || github.token }}' }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # Dossier facts are made from the latest data, the same files the site is built from.
      - name: Pull the latest data snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node pipeline/pull.ts --store=r2 --out=data/raw
      - name: Draft, check and open a pull request
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN || github.token }}
          TEXTS: ${{ inputs.texts }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # TEXTS is split on spaces on purpose: each word is a text id or --all.
          # shellcheck disable=SC2086
          npm run ai:draft -- $TEXTS --pr
