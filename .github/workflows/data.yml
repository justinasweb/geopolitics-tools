# The data pipeline (docs/data-pipeline.md).
#   every hour            fetch whatever is due, keep what passes its checks in R2, alert on problems
#   run by hand           same, with optional --only / --force (Actions tab → data → Run workflow),
#                         or only a Telegram test message
#   pull request          live check: every enabled source against the real service, saved only
#                         inside the run, the adapters run on what came back, plus an R2 write
#                         test; nothing the site uses is touched
name: data
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      only:
        description: Run just these sources (comma-separated ids, e.g. gdacs,worldbank); also ones switched off
        required: false
      force:
        description: Run every enabled source, due or not
        type: boolean
        default: false
      allow_shrink:
        description: Accept a sharp drop in values (when a source really removed data)
        type: boolean
        default: false
      test_alert:
        description: Only send a test message to Telegram (fetches nothing)
        type: boolean
        default: false
  pull_request:
    paths: ['pipeline/**', 'src/adapters/**', 'src/data/**', 'src/lib/places.ts', '.github/workflows/data.yml']
permissions:
  contents: read
concurrency:
  # Scheduled and manual runs share the state in R2, so they never overlap; a pull request check has its own group.
  group: ${{ github.event_name == 'pull_request' && format('data-pr-{0}', github.event.pull_request.number) || 'data' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Keyed sources run once their key is a repository secret; without it they stay off.
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      EMBER_API_KEY: ${{ secrets.EMBER_API_KEY }}
      UCDP_TOKEN: ${{ secrets.UCDP_TOKEN }}
      IPC_API_KEY: ${{ secrets.IPC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      # The pipeline uses only Node's own modules, so there is nothing to install.
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - name: Send a test alert
        if: inputs.test_alert
        run: node pipeline/run.ts --test-alert
      - name: Fetch what is due
        if: ${{ !inputs.test_alert }}
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          SHRINK: ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
        run: node pipeline/run.ts --store=r2 --fail-on-alert ${ONLY:+--only=$ONLY} $FORCE $SHRINK

  live-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Keyed sources run once their key is a repository secret; without it they stay off.
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      EMBER_API_KEY: ${{ secrets.EMBER_API_KEY }}
      UCDP_TOKEN: ${{ secrets.UCDP_TOKEN }}
      IPC_API_KEY: ${{ secrets.IPC_API_KEY }}
      # A few calls are enough to check the format; the hourly run does the backfill within the daily limit.
      COMTRADE_MAX_CALLS: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - name: Every enabled source against the real service
        run: node pipeline/run.ts --store=dir:.data --force --fail-on-error
      - name: Adapters on the fetched files
        if: success() || failure()
        run: node pipeline/pull.ts --store=dir:.data --out=.data/raw && node pipeline/adapter-check.ts .data/raw
      - name: Write to and read from R2
        # Also when a source failed above; forked pull requests get no secrets, so skip rather than fail.
        if: (success() || failure()) && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node pipeline/r2-check.ts
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: data-live-check, path: .data, retention-days: 7, if-no-files-found: ignore, include-hidden-files: true }
