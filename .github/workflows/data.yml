# The data pipeline (docs/data-pipeline.md).
#   every hour            fetch whatever is due, keep what passes its checks in R2, alert on problems
#   run by hand           same, with optional --only / --force (Actions tab → data → Run workflow),
#                         or only a Telegram test message
#   a week archived       the run that freezes a closed week starts week.yml to draft its summary
#   new data              when the latest snapshot is newer than the last production deploy, and no deploy
#                         started in the last 23 hours, the run starts one (ci.yml), so new data reaches the
#                         site within about a day
#   pull request          (pipeline changes only) live check: every enabled source against the real
#                         service, saved only inside the run, the adapters run on what came back,
#                         plus an R2 write test; nothing the site uses is touched. Adapter and place
#                         code changes are checked by ci instead, on the latest snapshot.
name: data
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      only:
        description: Run just these sources (comma-separated ids, e.g. gdacs,worldbank); also ones switched off
        required: false
      force:
        description: Run every enabled source, due or not
        type: boolean
        default: false
      allow_shrink:
        description: Accept a sharp drop in values (when a source really removed data)
        type: boolean
        default: false
      test_alert:
        description: Only send a test message to Telegram (fetches nothing)
        type: boolean
        default: false
  pull_request:
    paths: ['pipeline/**', '.github/workflows/data.yml']
permissions:
  contents: read
concurrency:
  # Scheduled and manual runs share the state in R2, so they never overlap; a pull request check has its own group.
  group: ${{ github.event_name == 'pull_request' && format('data-pr-{0}', github.event.pull_request.number) || 'data' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # To start week.yml once a week is archived, and the daily production deploy (ci.yml).
      actions: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Keyed sources run once their key is a repository secret; without it they stay off.
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      EMBER_API_KEY: ${{ secrets.EMBER_API_KEY }}
      UCDP_TOKEN: ${{ secrets.UCDP_TOKEN }}
      IPC_API_KEY: ${{ secrets.IPC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      # The pipeline uses only Node's own modules, so there is nothing to install.
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - name: Send a test alert
        if: inputs.test_alert
        run: node pipeline/run.ts --test-alert
      - name: Fetch what is due
        id: fetch
        if: ${{ !inputs.test_alert }}
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          SHRINK: ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
        run: node pipeline/run.ts --store=r2 --fail-on-alert ${ONLY:+--only=$ONLY} $FORCE $SHRINK
      # The week was frozen before any fetch, so its summary is drafted even when a source failed in this run.
      - name: Draft the summary of the week just archived
        if: ${{ !cancelled() && steps.fetch.outputs.frozen != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.fetch.outputs.frozen }}
        run: gh workflow run week.yml --ref main -f task=summary -f week="$WEEK"
      # Pages are built from the snapshot at deploy time. A snapshot made after the last production deploy (by this
      # run, an earlier one or an import) starts one, at most once a day: none if any deploy started in the last
      # 23 hours (a merge, the week's deploy or this one). Snapshot ids are their UTC time, 2026-11-06T0723Z.
      - name: Deploy new data, once a day
        if: ${{ !cancelled() && steps.fetch.outputs.snapshot != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ steps.fetch.outputs.snapshot }}
        run: |
          made=$(date -u -d "${SNAPSHOT:0:13}:${SNAPSHOT:13:2}:00Z" +%s)
          runs=$(gh run list --workflow ci.yml --branch main --limit 50 --json event,conclusion,createdAt \
            --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")]')
          # Live: the last deploy that passed or is still going. Tried: the last one at all, so a failing deploy is
          # not started again every hour.
          live=$(jq -r '[.[] | select(.conclusion == "success" or .conclusion == "")][0].createdAt // ""' <<< "$runs")
          tried=$(jq -r '.[0].createdAt // ""' <<< "$runs")
          at() { [ -n "$1" ] && date -u -d "$1" +%s || echo 0; }
          if [ "$made" -le "$(at "$live")" ]; then
            echo "Snapshot $SNAPSHOT is already live (deploy of $live)."
          elif [ $(( $(date -u +%s) - $(at "$tried") )) -lt $((23 * 3600)) ]; then
            echo "Snapshot $SNAPSHOT is new; a deploy started $tried, so it waits for the next day's." >> "$GITHUB_STEP_SUMMARY"
          else
            gh workflow run ci.yml --ref main
            echo "Snapshot $SNAPSHOT is newer than the last deploy (${live:-none}); production deploy started." >> "$GITHUB_STEP_SUMMARY"
          fi

  live-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Keyed sources run once their key is a repository secret; without it they stay off.
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      EMBER_API_KEY: ${{ secrets.EMBER_API_KEY }}
      UCDP_TOKEN: ${{ secrets.UCDP_TOKEN }}
      IPC_API_KEY: ${{ secrets.IPC_API_KEY }}
      # A few calls are enough to check the format; the hourly run does the backfill within the daily limit.
      COMTRADE_MAX_CALLS: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - name: Every enabled source against the real service
        run: node pipeline/run.ts --store=dir:.data --force --fail-on-error
      - name: Adapters on the fetched files
        if: success() || failure()
        run: node pipeline/pull.ts --store=dir:.data --out=.data/raw && node pipeline/adapter-check.ts .data/raw
      - name: Write to and read from R2
        # Also when a source failed above; forked pull requests get no secrets, so skip rather than fail.
        if: (success() || failure()) && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node pipeline/r2-check.ts
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: data-live-check, path: .data, retention-days: 7, if-no-files-found: ignore, include-hidden-files: true }
